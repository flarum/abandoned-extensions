name: Validate

on:
  pull_request:
    paths:
      - abandoned.json
      - scripts/validate.py
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate structure and formatting
        run: python3 scripts/validate.py

      - name: Check packages exist on Packagist (warning only)
        if: ${{ !cancelled() }}
        run: python3 scripts/validate.py --packagist
